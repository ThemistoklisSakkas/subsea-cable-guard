# All regions, thresholds and paths live here. Code reads nothing hard-coded.
seed: 42

paths:
  data: data                 # public-safe inputs (Danish AIS, EMODnet, GEBCO)
  private: private           # Eastern Med case study - git-ignored
  outputs: outputs           # public-region results and figures (git-ignored until curated)
  land: ../maritime-ais-gnss/data/reference/ne/ne_10m_land.zip   # Natural Earth (public domain)

regions:
  denmark:
    # Development region (Danish Maritime Authority historical AIS)
    bbox: {lat_min: 53.5, lat_max: 58.5, lon_min: 6.0, lon_max: 16.5}
    metric_crs: "EPSG:25832"          # ETRS89 / UTM 32N
    # Existing DMA data, cleaned and segmented by the maritime-ais-gnss pipeline
    # (2025-06-02..06). Read in place, not duplicated.
    trajectories_dir: ../maritime-ais-gnss/data/processed/trajectories
    vessels: ../maritime-ais-gnss/data/processed/vessels.parquet
    private: false
  eastmed:
    # Case-study region: Ionian, Aegean, Crete, Cyprus, Levantine basin, Dardanelles
    bbox: {lat_min: 31.5, lat_max: 41.5, lon_min: 19.0, lon_max: 36.5}
    # Region spans UTM zones 34-36: use one equal-area projection centred on the region
    metric_crs: "+proj=laea +lat_0=36 +lon_0=28 +x_0=0 +y_0=0 +ellps=WGS84 +units=m +no_defs"
    private: true

collector:
  region: eastmed
  url: wss://stream.aisstream.io/v0/stream
  message_types:
    - PositionReport                 # Class A (types 1-3)
    - StandardClassBPositionReport   # Class B (type 18)
    - ExtendedClassBPositionReport   # Class B extended (type 19)
    - ShipStaticData                 # Class A static/voyage (type 5)
    - StaticDataReport               # Class B static (type 24)
  out_subdir: eastmed/ais            # under paths.private
  log_subdir: eastmed/logs           # under paths.private
  flush_interval_s: 60               # max data lost on a hard kill
  flush_max_rows: 50000
  stats_interval_s: 300              # heartbeat line every 5 min
  idle_timeout_s: 90                 # no message for this long -> reconnect
  subscribe_timeout_s: 3             # aisstream closes if no subscription within 3 s
  backoff_initial_s: 2
  backoff_max_s: 300
  lock_port: 47613                   # single-instance guard (localhost only)

# ---------------------------------------------------------------- Phase 1: infrastructure
infrastructure:
  buffers_nm: [0.5, 1.0, 2.0]
  # A route is only as good as its source. Buffers narrower than the source's
  # positional uncertainty would give false precision, so each accuracy class has
  # a minimum buffer at which its geometries are used.
  min_buffer_nm:
    surveyed: 0.5      # national authorities via EMODnet
    community: 1.0     # OpenStreetMap: traced from charts/imagery, variable quality
    schematic: 2.0     # TeleGeography-style schematic routes
  sources:
    emodnet:
      url: https://ows.emodnet-humanactivities.eu/wfs
      accuracy: surveyed
      licence: CC BY 4.0
      layers:              # layer -> asset type
        pipelines: pipeline
        pcablesbshcontis: power
        pcablesnve: power
        pcablesshom: power
        bshcontiscables: telecom
        shomcables: telecom
        sigcables: telecom
        maltacables: telecom
        cicacables: telecom
        ukfibrecables: telecom
    osm:
      url: https://overpass-api.de/api/interpreter
      fallback_url: https://overpass.kumi.systems/api/interpreter
      accuracy: community
      licence: ODbL 1.0
      timeout_s: 240

# ---------------------------------------------------------------- Phase 1: traffic density
density:
  cell_m: 1000            # grid cell size in the region's metric CRS
  max_dt_s: 600           # time between fixes credited to a cell is capped (gaps are not presence)

# ---------------------------------------------------------------- Phase 2: exposure
exposure:
  # State vessels are outside the scope of this tool (ethics rule): excluded before analysis.
  excluded_ship_types: ["Military", "Law enforcement", "SAR"]
  anchored_statuses: ["At anchor", "Moored"]
  loiter_min_duration_min: 20     # inside a buffer at least this long...
  loiter_max_sog_kn: 3.0          # ...with median speed at or below this = loitering
  cog_valid_min_sog_kn: 1.0       # below this, course over ground is noise
  bearing_step_m: 50              # cable direction from +/- 50 m around the nearest point
  simplify_m: 10                  # max line simplification error for the distance index
  index_piece_m: 1000             # index lines as straight pieces of at most 1 km (speed)

bathymetry:
  url: https://ows.emodnet-bathymetry.eu/wcs
  coverage: emodnet__mean         # EMODnet Bathymetry DTM, metres (negative = below sea level)
  scale_factor: 0.25              # 1/16 arc-min native -> ~1/4 arc-min (~460 m) is enough here
  tile_deg: 2.5                   # request the region in tiles to stay below server limits
  licence: CC BY 4.0
