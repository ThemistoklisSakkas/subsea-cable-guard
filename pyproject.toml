[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cableguard"
version = "0.1.0"
description = "AIS-based monitoring of vessel behaviour that may put subsea cables and pipelines at risk (flagged for human review)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "websockets>=13",
]

[project.optional-dependencies]
geo = ["shapely>=2.0", "geopandas>=1.0", "pyproj>=3.6", "requests>=2.31", "rasterio>=1.3"]
ml = ["scikit-learn>=1.4"]
viz = ["matplotlib>=3.8", "streamlit>=1.35", "pydeck>=0.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
